[project]
name = "studio-engineer-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.2,<2",
  "pydantic>=2.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
]

[project.optional-dependencies]
kokoro = ["kokoro-onnx>=0.4"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
